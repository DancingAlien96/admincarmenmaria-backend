---
# Despliegue: backend + MySQL en contenedores (docker compose); frontend estatico
# servido por Nginx. Reejecutable para cada cambio.
# Uso: ansible-playbook -i inventory.ini deploy.yml -e @secrets.yml
- name: Desplegar Carmen Maria
  hosts: carmenmaria
  become: true
  vars_files:
    - group_vars/all.yml

  tasks:
    # --- Codigo ---
    - name: Clonar/actualizar backend
      git:
        repo: "{{ backend_repo }}"
        dest: "{{ backend_dir }}"
        version: "{{ git_branch }}"
        force: true

    - name: Clonar/actualizar frontend
      git:
        repo: "{{ frontend_repo }}"
        dest: "{{ frontend_dir }}"
        version: "{{ git_branch }}"
        force: true

    # --- .env para docker compose (variables de los contenedores) ---
    - name: Escribir .env de compose
      no_log: true
      copy:
        dest: "{{ backend_dir }}/.env"
        mode: "0600"
        content: |
          MYSQL_DATABASE={{ mysql_database }}
          MYSQL_USER={{ mysql_user }}
          MYSQL_PASSWORD={{ mysql_password }}
          MYSQL_ROOT_PASSWORD={{ mysql_root_password }}
          PUBLIC_API_URL={{ public_api_url }}
          JWT_SECRET={{ jwt_secret }}
          ADMIN_EMAIL={{ admin_email }}
          ADMIN_PASSWORD={{ admin_password }}
          ADMIN_NAME={{ admin_name }}
          WOO_URL={{ woo_url }}
          WOO_CONSUMER_KEY={{ woo_consumer_key }}
          WOO_CONSUMER_SECRET={{ woo_consumer_secret }}
          SMTP_HOST={{ smtp_host }}
          SMTP_PORT={{ smtp_port }}
          SMTP_USER={{ smtp_user }}
          SMTP_PASS={{ smtp_pass }}
          SMTP_FROM={{ smtp_from }}
          SUPERVISOR_EMAIL={{ supervisor_email }}

    # --- Contenedores: build + up (migraciones y seed corren en el entrypoint) ---
    - name: Build y levantar contenedores (mysql + backend)
      command: docker compose -f docker-compose.prod.yml up -d --build
      args:
        chdir: "{{ backend_dir }}"

    - name: Esperar a que el backend responda
      uri:
        url: "http://127.0.0.1:{{ backend_port }}/health"
        status_code: 200
      register: health
      until: health.status == 200
      retries: 30
      delay: 4

    # Cron: sincroniza WooCommerce cada hora ejecutando el CLI dentro del contenedor.
    - name: Programar sincronizacion horaria de WooCommerce
      cron:
        name: "sync-woocommerce"
        minute: "0"
        job: "docker exec carmenmaria-backend node dist/cli/sync-woo.js >> /var/log/carmenmaria-sync.log 2>&1"

    - name: Programar recordatorios de pago (diario 9am)
      cron:
        name: "whatsapp-reminders"
        minute: "0"
        hour: "9"
        job: "docker exec carmenmaria-backend node dist/cli/send-reminders.js >> /var/log/carmenmaria-reminders.log 2>&1"

    # --- Frontend estatico ---
    - name: Instalar dependencias del frontend
      command: npm ci
      args:
        chdir: "{{ frontend_dir }}"

    - name: Compilar frontend (export estatico)
      command: npx next build
      args:
        chdir: "{{ frontend_dir }}"
      environment:
        NEXT_PUBLIC_API_URL: "{{ public_api_url }}"

    - name: Crear web root
      file:
        path: "{{ web_root }}"
        state: directory
        mode: "0755"

    - name: Publicar archivos estaticos (out/ -> web root)
      synchronize:
        src: "{{ frontend_dir }}/out/"
        dest: "{{ web_root }}/"
        delete: true
        recursive: true
      delegate_to: "{{ inventory_hostname }}"
